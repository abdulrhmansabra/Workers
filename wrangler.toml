name = "workers"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "aishorts-57d93"
ENVIRONMENT = "production"
CRUN_BASE_URL = "https://api.crun.ai"
ALLOWED_ORIGIN = "*"
ADMOB_SSV_ENABLED = "true"
MAX_UPLOAD_SIZE_MB = "50"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "ai-shorts-media"

[[kv_namespaces]]
binding = "KV_CACHE"
id = "e198b0f6af5e40c6bb98078d44562844"

[triggers]
crons = ["0 3 * * *"]

# Preview Settings (isolated from Production)
[previews.vars]
ADMOB_SSV_ENABLED = "true"
ALLOWED_ORIGIN = "*"
CRUN_BASE_URL = "https://api.crun.ai"
ENVIRONMENT = "preview"
FIREBASE_PROJECT_ID = "aishorts-57d93"
MAX_UPLOAD_SIZE_MB = "50"

[[previews.kv_namespaces]]
binding = "KV_CACHE"
id = "d801bf6e6df340d4a6489b479dfa6348"

[[previews.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "preview-ai-shorts-media"
